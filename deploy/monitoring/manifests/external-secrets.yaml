# Secrets for the monitoring stack, synced from Vault (secret/go-feed/monitoring).
# Sync wave -1 so they exist before Alertmanager and Grafana start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: go-feed/monitoring
        property: slack-webhook-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: go-feed/monitoring
        property: grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: go-feed/monitoring
        property: grafana-admin-password
