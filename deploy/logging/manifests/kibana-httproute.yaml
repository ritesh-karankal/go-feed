# Kibana on the shared ALB at /kibana (Kibana runs with server.basePath=/kibana)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: logging
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: go-feed-gateway
      namespace: default
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kibana
      backendRefs:
        - name: kibana-kb-http
          port: 5601
