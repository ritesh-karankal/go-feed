imagePullSecrets:
  - name: ghcr-secret

api:
  name: go-feed
  # Used only when autoscaling is disabled
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: ghcr.io/ritesh-karankal/go-feed
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    targetPort: 8080
  envFromSecret: go-feed-secrets
  # Prometheus metrics endpoint (cmd/api/metrics.go)
  metrics:
    path: /metrics
    serviceMonitor:
      enabled: true
      interval: 30s
  # Non-secret, environment-specific settings (e.g. FRONTEND_URL,
  # EXTERNAL_URL). Set per environment in deploy/app/values-<env>.yaml.
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    path: /v1/health
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    path: /v1/health
    initialDelaySeconds: 5
    periodSeconds: 10

# Database migrations, run as an init container of the API
migrate:
  image:
    repository: ghcr.io/ritesh-karankal/go-feed-migrate
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# In-cluster Postgres. When enabled, the API's DB_ADDR is overridden to
# point at this instance (password from POSTGRES_PASSWORD in the secret).
postgres:
  enabled: true
  name: go-feed-postgres
  image: postgres:16.15-alpine
  port: 5432
  database: socialnetwork
  user: admin
  passwordSecret:
    name: go-feed-secrets
    key: POSTGRES_PASSWORD
  storage:
    storageClassName: ebs-gp3
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# In-cluster Redis cache. When enabled, the API's REDIS_ADDR/REDIS_ENABLED
# are set to use it (password from REDIS_PW in the secret).
redis:
  enabled: true
  name: go-feed-redis
  image: redis:8.10.2-alpine
  port: 6379
  # Evicts least-recently-used keys at this size (cache only)
  maxMemory: 100mb
  passwordSecret:
    name: go-feed-secrets
    key: REDIS_PW
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

frontend:
  name: go-feed-frontend
  # Used only when autoscaling is disabled
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: ghcr.io/ritesh-karankal/go-feed-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  livenessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 15
  readinessProbe:
    path: /
    initialDelaySeconds: 3
    periodSeconds: 10
