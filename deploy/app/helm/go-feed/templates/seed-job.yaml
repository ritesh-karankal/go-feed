{{- if .Values.seed.enabled }}
# Loads sample users/posts/comments (cmd/migrate -seed). Runs after every
# Argo CD sync; a no-op once the data exists. Dev environments only.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.api.name }}-seed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.api.name }}-seed
    {{- include "gopher-feed.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Keep the last run (for its logs) until the next sync replaces it
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.api.name }}-seed
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          args: ["-seed"]
          {{- with .Values.api.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- with (include "gopher-feed.dbAddrEnv" .) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
