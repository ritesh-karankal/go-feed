apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: frontend-tg-config
  namespace: default
spec:
  targetReference:
    name: go-feed-frontend
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: backend-tg-config
  namespace: default
spec:
  targetReference:
    name: go-feed
  defaultConfiguration:
    targetType: ip
    # The API only serves /v1/*; the default "/" health check gets a 404
    healthCheckConfig:
      healthCheckPath: /v1/health
      healthCheckProtocol: HTTP
      matcher:
        httpCode: "200"
