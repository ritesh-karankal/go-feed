apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: argo-tg-config
  namespace: argocd
spec:
  targetReference:
    name: argo-cd-argocd-server
  defaultConfiguration:
    targetType: ip
    # Argo CD is served under server.rootpath=/argocd; "/" is not a health endpoint
    healthCheckConfig:
      healthCheckPath: /argocd/healthz
      healthCheckProtocol: HTTP
      matcher:
        httpCode: "200"
