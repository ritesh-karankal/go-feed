name: CI - Build, Scan & Push

on:
  workflow_dispatch:

  push:
    branches: [main]
    # Release tags (v0.1.0, ...); path filters do not apply to tag pushes
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "cmd/migrate/**"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - "cmd/migrate/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal scripts)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -count=1 ./...

  build-scan-push:
    name: Build, Scan & Push (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # API server
          - image: go-feed
            cmd: api
          # Database migrations (embedded SQL files)
          - image: go-feed-migrate
            cmd: migrate

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

    steps:
      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history and tags, so git describe can find the last release
          fetch-depth: 0

      # ---------------------------------------------------
      # Version baked into the binary: v0.1.0 on a tag push,
      # v0.1.0-3-gabc1234 for later commits on main
      # ---------------------------------------------------
      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------
      # 2. Set up Docker Buildx
      # ---------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # 3. Build Docker image
      # ---------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ steps.version.outputs.version }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ---------------------------------------------------
      # 4. Security scan with Trivy
      # ---------------------------------------------------
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1
          format: table

      # ---------------------------------------------------
      # 5. Login to GitHub Container Registry
      #    Only required when pushing to main
      # ---------------------------------------------------
      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # 6. Push image to GHCR
      # ---------------------------------------------------
      - name: Push image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker push ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Release image, e.g. go-feed:v0.1.0
            docker tag ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          else
            docker push ${{ env.IMAGE_NAME }}:latest
          fi