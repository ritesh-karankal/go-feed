name: Frontend CI — Build, Scan & Push

on:
  push:
    branches: [ main ]
    # Only trigger when frontend source code or Dockerfile changes
    paths:
      - "frontend/**"

  pull_request:
    branches: [ main ]
    paths:
      - "frontend/**"

permissions:
  contents: read
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  # Image: ghcr.io/ritesh-karankal/go-feed-frontend
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/go-feed-frontend

jobs:
  build-scan-push:
    name: Build, Scan & Push Frontend to GHCR
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Set up Docker Buildx (enables layer caching)
      # ---------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------
      # 3. Log in to GitHub Container Registry
      # ---------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # 4. Build Docker image from frontend/Dockerfile
      #    Tag with commit SHA for traceability
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            -t ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./frontend

      # ---------------------------------------------------
      # 5. Security Scan with Trivy (before push)
      #    Scans for HIGH and CRITICAL vulnerabilities
      # ---------------------------------------------------
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library
          format: table

      # ---------------------------------------------------
      # 6. Push image to GHCR (only on push to main, not PRs)
      # ---------------------------------------------------
      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
