services:
  db:
    image: postgres:16.3
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: socialnetwork
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - backend

volumes:
  db-data:

networks:
  backend:
    driver: bridge