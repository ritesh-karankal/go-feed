apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-feed
  namespace: default
  labels:
    app: go-feed
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-feed
  template:
    metadata:
      labels:
        app: go-feed
    spec:
      # Pull the image from GitHub Container Registry.
      # Replace <tag> with the image tag you want to deploy (e.g. latest, v1.0.0, or a commit SHA).
      containers:
        - name: go-feed
          image: ghcr.io/ritesh-karankal/go-feed:<tag>
          ports:
            - containerPort: 8080

          env:
            - name: ADDR
              value: ":8080"

            # Reference secrets from a Kubernetes Secret (create separately).
            # kubectl create secret generic go-feed-secrets \
            #   --from-literal=DB_ADDR="postgres://..." \
            #   --from-literal=AUTH_TOKEN_SECRET="..."
            - name: DB_ADDR
              valueFrom:
                secretKeyRef:
                  name: go-feed-secrets
                  key: DB_ADDR

            - name: AUTH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: go-feed-secrets
                  key: AUTH_TOKEN_SECRET

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

      # Required to pull private GHCR images.
      # kubectl create secret docker-registry ghcr-secret \
      #   --docker-server=ghcr.io \
      #   --docker-username=<github-username> \
      #   --docker-password=<github-pat>
      imagePullSecrets:
        - name: ghcr-secret
