apiVersion: v1
kind: Service
metadata:
  name: go-feed
  namespace: default
  labels:
    app: go-feed
spec:
  selector:
    app: go-feed
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  # ClusterIP is correct here — the ALB Gateway routes directly to pod IPs,
  # not through the Service IP. No need for NodePort or LoadBalancer type.
  type: ClusterIP
