apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        # Production Best Practice: Kubernetes Auth Engine
        # ESO uses its own mounted ServiceAccount JWT token automatically.
        # No manual token secret required!
        kubernetes:
          mountPath: "kubernetes"
          role: "go-feed-vault-role"
          # serviceAccountRef tells ESO which SA JWT to use for Vault auth.
          # This uses the ESO controller's own ServiceAccount — zero manual tokens.
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
