apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Production Best Practice: EKS Pod Identity / IRSA
        # Uses ServiceAccount IAM role without static AWS keys.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
