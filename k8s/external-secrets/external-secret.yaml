apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: go-feed-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: go-feed-secrets
    creationPolicy: Owner
  # Production Best Practice:
  # Automatically extract ALL key-value pairs stored under 'secret/go-feed/production' in Vault.
  # No need to manually list every secret key!
  dataFrom:
    - extract:
        key: go-feed/production
