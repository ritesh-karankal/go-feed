## Argo CD configuration for gopher-feed
## Adapted argocd-values-9.4.0.yaml
## Uses a shared HTTP-only ALB Gateway and a path prefix for the Argo CD UI.

nameOverride: argocd
fullnameOverride: ""

crds:
  install: true
  keep: true

# Add a DNS name here after registering/configuring a domain.
# global:
#   domain: gofeed-demo.duckdns.org

configs:
  cm:
    create: true
    # Required: allows Kustomize to use Helm charts inside ArgoCD applications
    kustomize.buildOptions: "--enable-helm"
    admin.enabled: true
    timeout.reconciliation: 180s

  params:
    create: true
    # HTTP-only access; Argo CD serves behind the ALB at /argocd.
    server.insecure: true
    server.rootpath: /argocd
    server.basehref: /argocd

  rbac:
    create: true
    policy.default: ''
    scopes: "[groups]"
    policy.matchMode: "glob"

server:
  # Expose ArgoCD UI via Gateway API HTTPRoute (no Ingress needed)
  httproute:
    enabled: true
    # Add hostnames after a domain is configured; without this, the route
    # matches the Gateway's generated ALB hostname over HTTP.
    # hostnames:
    #   - gofeed-demo.duckdns.org
    parentRefs:
      - name: go-feed-gateway
        namespace: default
        sectionName: http
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /argocd
