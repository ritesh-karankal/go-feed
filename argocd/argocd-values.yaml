## Argo CD configuration for gopher-feed
## Adapted argocd-values-9.4.0.yaml
## Key differences: no domain/TLS, uses ALB Gateway HTTP only

nameOverride: argocd
fullnameOverride: ""

crds:
  install: true
  keep: true

global:
  domain: argocd.example.com   # Not used (no domain), kept for reference

configs:
  cm:
    create: true
    # Required: allows Kustomize to use Helm charts inside ArgoCD applications
    kustomize.buildOptions: "--enable-helm"
    admin.enabled: true
    timeout.reconciliation: 180s

  params:
    create: true
    # Run ArgoCD server in insecure mode since TLS is terminated at ALB
    server.insecure: true

  rbac:
    create: true
    policy.default: ''
    scopes: "[groups]"
    policy.matchMode: "glob"

server:
  # Expose ArgoCD UI via Gateway API HTTPRoute (no Ingress needed)
  httproute:
    enabled: true
    parentRefs:
      - name: go-feed-gateway
        namespace: default
        sectionName: http
    # No hostname since we have no domain — ALB DNS name is used directly
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
